          coordinates:
          - - 16.9342
            - 52.4083
          - - 16.9348
            - 52.4083
          - - 16.9348
            - 52.4075
          - - 16.9348
            - 52.4068
          - - 16.9345
            - 52.4065
    RouteMetadataWrite:
      type: object
      additionalProperties: false
      required:
      - cityId
      - title
      - shortDescription
      - description
      properties:
        cityId:
          $ref: '#/components/schemas/ResourceId'
        title:
          type: string
          minLength: 1
          maxLength: 160
        shortDescription:
          type: string
          minLength: 0
          maxLength: 280
        description:
          type: string
          minLength: 0
          maxLength: 5000
        imageUrl:
          $ref: '#/components/schemas/ImageUrl'
      description: POST creates a draft with no stops. PUT replaces all editable metadata; omitted imageUrl
        clears it. Trim text before validation. Empty descriptions are allowed while drafting, but not
        publishing. cityId can change only on an empty draft; otherwise 409 ROUTE_CITY_CONFLICT. Status,
        categories, statistics and geometry are server-owned.
      examples:
      - cityId: city_poznan
        title: Serce Starego Miasta
        shortDescription: Krótki spacer od Rynku do Fary.
        description: Spacer po historycznym centrum z czasem na zwiedzanie.
        imageUrl: null
    AdminRouteSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - city
      - title
      - shortDescription
      - imageUrl
      - categoryIds
      - statistics
      - status
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        city:
          $ref: '#/components/schemas/CityReference'
        title:
          type: string
          minLength: 1
          maxLength: 160
        shortDescription:
          type: string
          minLength: 0
          maxLength: 280
        imageUrl:
          $ref: '#/components/schemas/ImageUrl'
        categoryIds:
          type: array
          items:
            $ref: '#/components/schemas/CategoryId'
          minItems: 0
          maxItems: 4
          uniqueItems: true
        statistics:
          oneOf:
          - $ref: '#/components/schemas/RouteStatistics'
          - type: 'null'
          description: Null when no valid routed statistics are available. Published routes always have
            statistics.
        status:
          type: string
          enum:
          - draft
          - published
      allOf:
      - if:
          properties:
            status:
              const: published
          required:
          - status
        then:
          properties:
            shortDescription:
              minLength: 1
            categoryIds:
              minItems: 1
            statistics:
              $ref: '#/components/schemas/RouteStatistics'
      examples:
      - id: route_stare_miasto
        city:
          id: city_poznan
          name: Poznań
        title: Serce Starego Miasta
        shortDescription: Krótki spacer od Rynku do Fary.
        imageUrl: null
        categoryIds:
        - sightseeing
        statistics:
          distanceMeters: 250
          walkingDurationMinutes: 4
          visitDurationMinutes: 60
          totalDurationMinutes: 64
          estimatedCostPln: 0
          stopCount: 2
        status: published
    AdminRoute:
      type: object
      additionalProperties: false
      required:
      - id
      - city
      - title
      - shortDescription
      - imageUrl
      - categoryIds
      - statistics
      - status
      - description
      - stops
      - geometry
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        city:
          $ref: '#/components/schemas/CityReference'
        title:
          type: string
          minLength: 1
          maxLength: 160
        shortDescription:
          type: string
          minLength: 0
          maxLength: 280
        imageUrl:
          $ref: '#/components/schemas/ImageUrl'
        categoryIds:
          type: array
          items:
            $ref: '#/components/schemas/CategoryId'
          minItems: 0
          maxItems: 4
          uniqueItems: true
        statistics:
          oneOf:
          - $ref: '#/components/schemas/RouteStatistics'
          - type: 'null'
          description: Null when no valid routed statistics are available. Published routes always have
            statistics.
        status:
          type: string
          enum:
          - draft
          - published
        description:
          type: string
          minLength: 0
          maxLength: 5000
        stops:
          type: array
          items:
            $ref: '#/components/schemas/AdminRouteStop'
          minItems: 0
          maxItems: 50
        geometry:
          oneOf:
          - $ref: '#/components/schemas/WalkingGeometry'
          - type: 'null'
      description: Draft geometry/statistics are null when not ready and invalidated together after stop
        or routing/statistics-relevant Place changes. Safe Place metadata/category edits update embedded
        data and category unions without invalidating geometry/statistics. Both are non-null for published
        routes; never represent stale data as current. Published routes additionally require complete
        metadata, two distinct available same-city Places and routed data.
      allOf:
      - if:
          properties:
            status:
              const: published
          required:
          - status
        then:
          properties:
            shortDescription:
              minLength: 1
            categoryIds:
              minItems: 1
            statistics:
              $ref: '#/components/schemas/RouteStatistics'
            description:
              minLength: 1
            geometry:
              $ref: '#/components/schemas/WalkingGeometry'
            stops:
              minItems: 2
              items:
                properties:
                  place:
                    properties:
                      isAvailable:
                        const: true
      examples:
      - id: route_stare_miasto
        city:
          id: city_poznan
          name: Poznań
        title: Serce Starego Miasta
        shortDescription: ''
        imageUrl: null
        categoryIds: []
        statistics: null
        description: ''
        stops: []
        geometry: null
        status: draft
    ReplaceRouteStopsRequest:
      type: object
      additionalProperties: false
      required:
      - placeIds
      properties:
        placeIds:
          type: array
          items:
            $ref: '#/components/schemas/ResourceId'
          minItems: 0
          maxItems: 50
          uniqueItems: true
      description: Full desired ordered Place IDs. Adds, removes and reorders membership atomically; never
        deletes Places. Empty is allowed for drafts. Missing IDs are rejected with 422 PLACE_NOT_FOUND;
        cross-city IDs with 422 PLACE_CITY_MISMATCH. Duplicate IDs are a 400 validation error. No partial
        replacement on failure.
      examples:
      - placeIds:
        - place_stary_rynek
        - place_fara
    WalkingIntensity:
      type: string
      enum:
      - low
      - medium
      - high
      description: 'Maximum routed walking distance: low 3000 m, medium 6000 m, high 10000 m. Inclusive
        ceilings, in addition to budget/time constraints; not speed or an accessibility guarantee. Higher
        intensity permits but does not require more walking.'
    GenerateRouteRequest:
      type: object
      additionalProperties: false
      required:
      - cityId
      - categoryIds
      - budgetPln
      - maxMinutes
      - walkingIntensity
      properties:
        cityId:
          $ref: '#/components/schemas/ResourceId'
        categoryIds:
          type: array
          items:
            $ref: '#/components/schemas/CategoryId'
          minItems: 1
          maxItems: 4
          uniqueItems: true
        budgetPln:
          $ref: '#/components/schemas/MoneyPln'
        maxMinutes:
          type: integer
          minimum: 30
          description: Required maximum total time including walking and visits; no unlimited/null mode.
          maximum: 720
        walkingIntensity:
          $ref: '#/components/schemas/WalkingIntensity'
        excludePlaceIds:
          type: array
          items:
            $ref: '#/components/schemas/ResourceId'
          minItems: 0
          maxItems: 50
          uniqueItems: true
          description: Optional hard exclusions, default []. None may occur in returned stops. Unknown,
            unavailable or other-city IDs are harmless exclusions, not lookup errors. At most 50 unique
            IDs; no result history is stored.
      description: Available Places must belong to cityId, intersect categoryIds (OR matching) and not
        be excluded. All returned Places match at least one requested category; no requirement to cover
        every selected category. Prefer broader selected-category coverage when equally feasible, without
        violating budget/time/intensity ceilings. At least two distinct Places required. Repeating without
        exclusions may return the same result.
      examples:
      - cityId: city_poznan
        categoryIds:
        - sightseeing
        budgetPln: 150
        maxMinutes: 180
        walkingIntensity: medium
      - cityId: city_poznan
        categoryIds:
        - sightseeing
        - food
        budgetPln: 150
        maxMinutes: 180
        walkingIntensity: medium
        excludePlaceIds:
        - place_previous_cafe
    GeneratedRoute:
      type: object
      additionalProperties: false
      required:
      - city
      - title
      - categoryIds
      - statistics
      - stops
      - geometry
      properties:
        city:
          $ref: '#/components/schemas/CityReference'
        title:
          type: string
          minLength: 1
          maxLength: 160
        categoryIds:
          type: array
          items:
            $ref: '#/components/schemas/CategoryId'
          minItems: 1
          maxItems: 4
          uniqueItems: true
        statistics:
          $ref: '#/components/schemas/RouteStatistics'
        stops:
          type: array
          items:
            $ref: '#/components/schemas/RouteStop'
          minItems: 2
          maxItems: 50
        geometry:
          $ref: '#/components/schemas/WalkingGeometry'
      description: Ephemeral result with no permanent ID. Compatible city/title/categories/statistics/stops/geometry
        fields with curated viewer. categoryIds is the actual union of returned Place categories in /categories
        order (including co-tags), not a false claim that every requested category is covered. Every Place
        intersects requested categories. Cost <= budgetPln, total time <= maxMinutes, distance <= intensity
        ceiling, and excluded IDs absent. No persistence/history/job resource.
      examples:
      - city:
          id: city_poznan
          name: Poznań
        title: Serce Starego Miasta
        categoryIds:
        - sightseeing
        statistics:
          distanceMeters: 250
          walkingDurationMinutes: 4
          visitDurationMinutes: 60
          totalDurationMinutes: 64
          estimatedCostPln: 0
          stopCount: 2
        stops:
        - position: 1
          place:
            id: place_stary_rynek
            cityId: city_poznan
            name: Stary Rynek
            description: Historyczny rynek z renesansowym ratuszem.
            address: Stary Rynek, Poznań
            latitude: 52.4083
            longitude: 16.9342
            categoryIds:
            - sightseeing
            visitDurationMinutes: 30
            estimatedCostPln: 0
            imageUrl: null
        - position: 2
          place:
            id: place_fara
            cityId: city_poznan
            name: Fara Poznańska
            description: Barokowa bazylika przy ulicy Gołębiej.
            address: ul. Gołębia 1, Poznań
            latitude: 52.4065
            longitude: 16.9345
            categoryIds:
            - sightseeing
            visitDurationMinutes: 30
            estimatedCostPln: 0
            imageUrl: null
        geometry:
          type: LineString
          coordinates:
          - - 16.9342
            - 52.4083
          - - 16.9348
            - 52.4083
          - - 16.9348
            - 52.4075
          - - 16.9348
            - 52.4068
          - - 16.9345
            - 52.4065
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 3
          description: Trim surrounding whitespace and lowercase before syntax validation and identity
            lookup. Account identity uses the normalized address consistently.
        password:
          type: string
          minLength: 1
          maxLength: 128
      description: Same login for both roles; do not reapply new-password policy to existing passwords.
        Normalize email only. Unknown/disabled accounts and incorrect passwords share 401 UNAUTHORIZED.
        Only after a correct password may 403 EMAIL_NOT_VERIFIED disclose verification state.
      examples:
      - email: user@example.com
        password: a-long-example-password
    PoiSearchRequest:
      type: object
      additionalProperties: false
      required:
      - cityId
      - query
      properties:
        cityId:
          $ref: '#/components/schemas/ResourceId'
        query:
          type: string
          minLength: 2
          maxLength: 120
      description: Trim query. Simple city-scoped provider search; no persistence. Returns at most 10
        candidates, no continuation mechanism.
      examples:
      - cityId: city_poznan
        query: Stary Rynek
    PoiCandidate:
      type: object
      additionalProperties: false
      required:
      - providerIdentity
      - name
      - address
      - latitude
      - longitude
      properties:
        providerIdentity:
          $ref: '#/components/schemas/ProviderIdentity'
        name:
          type: string
          minLength: 1
          maxLength: 160
        address:
          type: string
          minLength: 0
          maxLength: 300
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      description: Search candidate, not an internal Place. Use the chosen cityId and returned identity
        to import. Provider key is opaque; clients must not construct it.
      examples:
      - providerIdentity:
          provider: poi_catalog
          providerPlaceId: poznan-123
        name: Stary Rynek
        address: Stary Rynek, Poznań
        latitude: 52.4083
        longitude: 16.9342
    PoiImportRequest:
      type: object
      additionalProperties: false
      required:
      - cityId
      - providerIdentity
      properties:
        cityId:
          $ref: '#/components/schemas/ResourceId'
        providerIdentity:
          $ref: '#/components/schemas/ProviderIdentity'
      description: Use an identity returned by search; backend obtains authoritative candidate data, never
        trusts frontend POI coordinates/content. New imports are unavailable Places with estimated cost
        0, visit time 30, empty categories and descriptions if absent. Review estimates/content before
        making available. imageUrl is null when no usable URL is available.
      examples:
      - cityId: city_poznan
        providerIdentity:
          provider: poi_catalog
          providerPlaceId: poznan-123
    FieldIssue:
      type: object
      additionalProperties: false
      required:
      - path
      - message
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 500
      description: Dotted field path, e.g. categoryIds.0 or placeIds.1; $ means a whole-request/readiness
        issue.
      examples:
      - path: budgetPln
        message: Must be non-negative
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - VALIDATION_ERROR
              - UNAUTHORIZED
              - FORBIDDEN
              - NOT_FOUND
              - CITY_NOT_SUPPORTED
              - PLACE_NOT_FOUND
              - PLACE_CITY_MISMATCH
              - PLACE_CITY_CONFLICT
              - PLACE_IN_USE
              - PLACE_IN_PUBLISHED_ROUTE
              - ROUTE_PUBLISHED
              - ROUTE_CITY_CONFLICT
              - PROVIDER_PLACE_CITY_CONFLICT
              - ROUTE_NOT_READY
              - NO_FEASIBLE_ROUTE
              - POI_NOT_FOUND
              - PROVIDER_ERROR
              - SERVICE_UNAVAILABLE
              - RATE_LIMITED
              - INTERNAL_ERROR
              - EMAIL_NOT_VERIFIED
              - INVALID_VERIFICATION_CODE
              - CURRENT_PASSWORD_INVALID
              description: Codes and applicable HTTP status are defined per operation. CITY_NOT_SUPPORTED
                (422) identifies invalid city body references; NOT_FOUND (404) identifies missing/hidden
                path resources. INVALID_VERIFICATION_CODE (400) also covers unknown email, used/invalidated
                codes and exhausted attempts, without distinguishing them.
            message:
              type: string
              minLength: 1
              maxLength: 500
            issues:
              type: array
              items:
                $ref: '#/components/schemas/FieldIssue'
              minItems: 1
      description: Stable code for frontend branching; message is diagnostic and need not be localized.
        issues is supplied for field validation/readiness where useful. No stack traces or provider credentials.
      examples:
      - error:
          code: VALIDATION_ERROR
          message: Invalid request
          issues:
          - path: budgetPln
            message: Must be non-negative
    CitiesResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/City'
          minItems: 0
    CategoriesResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
          minItems: 0
    RoutesResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CuratedRouteSummary'
          minItems: 0
    AdminPlacesResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminPlace'
          minItems: 0
    AdminRoutesResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminRouteSummary'
          minItems: 0
    PoiCandidatesResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PoiCandidate'
          minItems: 0
          maxItems: 10
    PlaceResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Place'
    AdminPlaceResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/AdminPlace'
    CuratedRouteResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/CuratedRoute'
    GeneratedRouteResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/GeneratedRoute'
    AdminRouteResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/AdminRoute'
    NewPassword:
      type: string
      minLength: 12
      maxLength: 128
      pattern: \S
      description: 12–128 characters, containing at least one non-whitespace character. No mandatory character
        classes. Do not trim, lowercase, truncate or normalize passwords. Same creation policy for both
        roles.
    RefreshToken:
      type: string
      minLength: 1
      maxLength: 4096
      description: Opaque sensitive token identifying one refresh session. Valid for 604800 seconds (7
        days) from login, without rotation or sliding expiry. Never accepted as a bearer access token.
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 3
          description: Trim surrounding whitespace and lowercase before syntax validation and identity
            lookup. Account identity uses the normalized address consistently.
        password:
          $ref: '#/components/schemas/NewPassword'
      description: Registration always creates role user with unverified email. No role/displayName/session
        fields are accepted. Existing accounts and passwords are never overwritten.
      examples:
      - email: user@example.com
        password: a-long-example-password
    VerificationRequired:
      type: object
      additionalProperties: false
      required:
      - verificationRequired
      properties:
        verificationRequired:
          type: boolean
          const: true
      description: Generic acceptance only; not proof of account existence or email delivery. No credentials/session
        are issued.
      examples:
      - verificationRequired: true
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - code
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 3
          description: Trim surrounding whitespace and lowercase before syntax validation and identity
            lookup. Account identity uses the normalized address consistently.
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: One-time code from the most recent verification email. Do not send as an integer;
            leading zeroes matter.
          minLength: 6
          maxLength: 6
      examples:
      - email: user@example.com
        code: '012345'
    ResendVerificationRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 3
          description: Trim surrounding whitespace and lowercase before syntax validation and identity
            lookup. Account identity uses the normalized address consistently.
      examples:
      - email: user@example.com
    VerificationStatus:
      type: object
      additionalProperties: false
      required:
      - emailVerified
      properties:
        emailVerified:
          type: boolean
          const: true
      description: Verification succeeded. No authenticated session is issued; log in afterwards.
      examples:
      - emailVerified: true
    TokenSession:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - refreshToken
      - tokenType
      - expiresIn
      - refreshExpiresAt
      properties:
        accessToken:
          type: string
          minLength: 1
          maxLength: 4096
        refreshToken:
          $ref: '#/components/schemas/RefreshToken'
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          const: 900
        refreshExpiresAt:
          type: string
          format: date-time
          description: Absolute original refresh-session expiry (login time + 7 days). Never moves on
            refresh; not the access-token expiry.
      description: Login creates a refresh session. Refresh issues a new 15-minute access token but returns
        the EXACT same refreshToken and refreshExpiresAt. Access lifetime can extend at most 15 minutes
        beyond refresh expiry; it never restores refresh validity. Token encodings and storage internals
        are not API contracts.
      examples:
      - accessToken: example-access-token-not-a-real-credential
        refreshToken: example-refresh-token-not-a-real-credential
        tokenType: Bearer
        expiresIn: 900
        refreshExpiresAt: '2026-11-16T12:00:00Z'
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required:
      - refreshToken
      properties:
        refreshToken:
          $ref: '#/components/schemas/RefreshToken'
      examples:
      - refreshToken: example-refresh-token-not-a-real-credential
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          $ref: '#/components/schemas/NewPassword'
      description: Requires bearer access token. Verify current password; new password must differ (400
        VALIDATION_ERROR with newPassword issue). Success revokes ALL refresh sessions and invalidates
        ALL access tokens for this account immediately, including caller, without issuing replacement
        credentials. Log in again with the new password.
      examples:
      - currentPassword: a-long-example-password
        newPassword: another-long-example-password
    CurrentUser:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - emailVerified
      - role
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 3
          description: Trim surrounding whitespace and lowercase before syntax validation and identity
            lookup. Account identity uses the normalized address consistently.
        emailVerified:
          type: boolean
          const: true
        role:
          type: string
          enum:
          - user
          - admin
      description: Authenticated verified user. Role comes from server-managed account state, never registration
        input or client flags. No profile-management API.
      examples:
      - id: user_123
        email: user@example.com
        emailVerified: true
        role: user
    VerificationRequiredResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/VerificationRequired'
    VerificationStatusResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/VerificationStatus'
    TokenSessionResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/TokenSession'
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/CurrentUser'
    CityReference:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        name:
          type: string
          minLength: 1
          maxLength: 160
      description: Compact city identity for route lists/details/results. Map centre and city description
        come from cached /cities, not duplicated per route.
  responses:
    BadRequest:
      description: Invalid JSON, unknown fields/query parameters, incorrect types or schema validation
        failure. Numeric strings are not accepted in JSON bodies.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid request
    Unauthorized:
      description: Missing, invalid or expired access credential, invalid login, or expired/revoked/invalid
        refresh session. Refresh tokens never authenticate bearer-protected operations.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication failed or session is invalid
      headers:
        WWW-Authenticate:
          description: Bearer challenge.
          schema:
            type: string
          example: Bearer realm="trasa"
    Forbidden:
      description: Authenticated principal does not have administrator access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: Administrator access required
    NotFound:
      description: Resource does not exist or is not publicly available. Draft routes and unavailable
        Places return the same 404 as unknown IDs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Resource not found
    ProviderFailure:
      description: External provider failed or returned unusable data; no partial write or fabricated
        geometry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PROVIDER_ERROR
              message: External provider failed
    ServiceUnavailable:
      description: Routing/POI service is unavailable or exceeded its synchronous processing window. Retry
        explicitly; no job is created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: Service temporarily unavailable
    RateLimited:
      description: Request limit exceeded. Retry-After gives whole seconds until retry. Email-based limits
        apply independently of whether the account exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Too many requests
      headers:
        Retry-After:
          description: Seconds until a retry is allowed.
          schema:
            type: integer
            minimum: 1
          example: 30
    InternalError:
      description: Unexpected server failure. No implementation details are exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: Internal server error
