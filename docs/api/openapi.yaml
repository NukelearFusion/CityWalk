      operationId: importPoi
      summary: Import a selected POI
      description: 'Creates an unavailable, editable Place (201). The (provider, providerPlaceId) pair
        identifies an import: retrying returns the existing Place unchanged (200), including when unavailable;
        concurrent duplicate imports must not create two Places. Existing identity associated with another
        city returns 409 PROVIDER_PLACE_CITY_CONFLICT. Unknown city returns 422 CITY_NOT_SUPPORTED; candidate
        missing or outside selected city returns 422 POI_NOT_FOUND. Unknown provider is 400 VALIDATION_ERROR.
        Fetching provider data fails with 502/503, without partial import. For an existing provider identity
        in the same city, return the internal Place without requiring a successful provider lookup; provider
