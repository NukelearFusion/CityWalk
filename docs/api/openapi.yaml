  /auth/register:
    post:
      tags:
      - Authentication
      operationId: registerUser
      summary: Register a regular user
      description: Validate and normalize email, validate password, create a role user account with unverified
        email only when new, and attempt email verification. Always return the same generic 202 for valid
        new, existing unverified and existing verified addresses; never return a duplicate-account conflict,
        overwrite existing credentials, or issue tokens. Existing-account registration does not implicitly
        resend codes; use resend-verification. Register/resend share an email-delivery limit of one request
        per 60 seconds and five per hour per normalized email; additionally at most 20 requests/hour per
        source IP. Apply request counters and 429 responses identically to every address, including unknown/already-verified
        accounts. If permitted, send only to an eligible unverified account. Generic 202 does not guarantee
        delivery; delivery failures must not expose account existence or provider details. No delivery
        job/status resource is exposed.
      responses:
        '202':
          description: Accepted; verification is required before any session can be issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequiredResponse'
              example:
                data:
                  verificationRequired: true
          headers:
            Cache-Control:
              description: Never cache authentication/user responses, including errors and empty success
                responses.
              schema:
                type: string
                const: no-store
              example: no-store
        '400':
          description: Invalid JSON, unknown fields/query parameters, incorrect types or schema validation
            failure. Numeric strings are not accepted in JSON bodies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Invalid request
          headers:
            Cache-Control:
              description: Never cache authentication/user responses, including errors and empty success
                responses.
              schema:
                type: string
                const: no-store
              example: no-store
        '429':
          description: Request limit exceeded. Retry-After gives whole seconds until retry. Email-based
            limits apply independently of whether the account exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: RATE_LIMITED
                  message: Too many requests
          headers:
            Retry-After:
              description: Seconds until a retry is allowed.
              schema:
                type: integer
                minimum: 1
              example: 30
            Cache-Control:
              description: Never cache authentication/user responses, including errors and empty success
                responses.
              schema:
                type: string
                const: no-store
              example: no-store
        '500':
          description: Unexpected server failure. No implementation details are exposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Internal server error
          headers:
            Cache-Control:
              description: Never cache authentication/user responses, including errors and empty success
                responses.
              schema:
                type: string
                const: no-store
              example: no-store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: user@example.com
              password: a-long-example-password
  /auth/verify-email:
    post:
      tags:
      - Authentication
      operationId: verifyEmail
      summary: Verify a one-time email code
      description: The latest code expires 10 minutes after issuance and is single-use. A resend invalidates
        older codes. Five failed attempts consume that code; request a new one. A successful verification
        also consumes it. Unknown emails, already used/invalidated/exhausted codes, expired codes and
        incorrect codes share 400 INVALID_VERIFICATION_CODE with the same message; do not expose attempt
        counters or account state. Limit all verification submissions to 10/minute per source IP (429
        independently of code/account validity). Success marks email verified but requires a separate
        login.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationStatusResponse'
              example:
                data:
                  emailVerified: true
          headers:
            Cache-Control:
              description: Never cache authentication/user responses, including errors and empty success
                responses.
              schema:
                type: string
                const: no-store
              example: no-store
        '400':
          description: 'Malformed input or unsuccessful verification; no account-existence distinctions.
            Codes: VALIDATION_ERROR, INVALID_VERIFICATION_CODE.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Invalid request
                INVALID_VERIFICATION_CODE:
                  summary: INVALID_VERIFICATION_CODE
                  value:
                    error:
                      code: INVALID_VERIFICATION_CODE
                      message: Verification code is invalid or expired
          headers:
            Cache-Control:
              description: Never cache authentication/user responses, including errors and empty success
                responses.
              schema:
                type: string
                const: no-store
              example: no-store
        '429':
          description: Request limit exceeded. Retry-After gives whole seconds until retry. Email-based
