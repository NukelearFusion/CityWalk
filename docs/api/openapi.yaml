        description:
          type: string
          minLength: 1
          maxLength: 5000
        stops:
          type: array
          items:
            $ref: '#/components/schemas/RouteStop'
          minItems: 2
          maxItems: 50
        geometry:
          $ref: '#/components/schemas/WalkingGeometry'
      description: Complete published route. All Places belong to the route city and are available. At
        least two distinct Places, complete metadata, consistent statistics and walking geometry are guaranteed.
        Public resources never expose drafts.
      examples:
      - id: route_stare_miasto
        city:
          id: city_poznan
          name: Poznań
        title: Serce Starego Miasta
        shortDescription: Krótki spacer od Rynku do Fary.
        imageUrl: null
        categoryIds:
        - sightseeing
        statistics:
          distanceMeters: 250
          walkingDurationMinutes: 4
          visitDurationMinutes: 60
          totalDurationMinutes: 64
          estimatedCostPln: 0
          stopCount: 2
        description: Spacer po historycznym centrum z czasem na zwiedzanie.
        stops:
