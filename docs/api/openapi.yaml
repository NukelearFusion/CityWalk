      operationId: logoutSession
      summary: Revoke the supplied refresh session
      description: The JSON refreshToken identifies the current session; no access bearer is required
        so logout still works after access expiry. Revoke this session server-side before 204; no subsequent
        refresh may succeed. Syntactically valid unknown, expired or already revoked tokens also return
        204 (idempotent, no existence disclosure). Other login sessions are unaffected. Already issued
        access tokens remain valid until their expiry, at most 15 minutes; logout does not invalidate
        them immediately. Client discards both tokens. If revocation cannot be completed, return 500 rather
        than claiming success. Maximum 60 requests/minute per source IP; 429 with Retry-After.
