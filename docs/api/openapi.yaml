openapi: 3.1.0
info:
  title: Trasa MVP API
  version: 1.1.0
  description: 'Target contract for the revised diploma MVP, not a description of the existing server.
    Public browsing/generation stays anonymous; user/admin share email verification and access/refresh
    sessions, and only admin may access /admin/*. All success bodies use {data: ...}; empty successes
    are 204. JSON bodies reject unknown properties and numeric strings. Unknown query parameters and nonempty
    bodies on bodyless operations return 400. Lists are complete, unpaginated and deterministically ordered.
    A syntactically valid collection filter without matches returns 200 with data: []; path resources
    use 404 when missing/hidden and unsupported city body references on generation/creation/import use
    422 CITY_NOT_SUPPORTED. POI search with an unsupported city returns an empty collection. IDs are opaque
    strings. Polish content in MVP. HTTPS outside local development. All /auth/* and /user/me responses
    (success/errors) require Cache-Control: no-store. Access tokens: 900 seconds; refresh sessions: 604800
    seconds from login, non-rotating, revocable, never extended. Logout revokes one refresh session; access
    tokens can survive up to 15 minutes. Password change invalidates all account access/refresh sessions
    immediately. Do not log/expose passwords, verification codes or tokens. Protect refresh credentials
    at rest (prefer non-recoverable verifiers rather than plaintext), without exposing storage internals.
    Native clients keep refresh tokens in platform secure storage. Transport examples are illustrative
    and not provider-verified walking paths.'
servers:
- url: /api/v1
  description: Same-origin base path; use an absolute deployment origin in native client configuration.
- url: http://localhost:4000/api/v1
  description: Local development; a physical phone uses the host LAN address instead of localhost.
security: []
tags:
- name: Reference data
- name: Routes
- name: Places
- name: Generation
- name: Authentication
- name: Admin Places
- name: Admin Routes
- name: Current user
paths:
  /cities:
    get:
      tags:
      - Reference data
      operationId: listCities
      summary: List supported cities
      description: Unpaginated collection; initial supported city is Poznań. Stable ordering by name then
        ID. No city CRUD.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitiesResponse'
              example:
                data:
                - id: city_poznan
                  name: Poznań
                  description: Spacery po historycznym centrum Poznania.
                  centerLatitude: 52.4083
                  centerLongitude: 16.9342
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
  /categories:
    get:
      tags:
      - Reference data
      operationId: listCategories
      summary: List interest categories
      description: Returns sightseeing, food, entertainment, nature in this order, with Polish display
        names. No category CRUD.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
              example:
                data:
                - id: sightseeing
                  name: Zwiedzanie
                - id: food
                  name: Jedzenie
                - id: entertainment
                  name: Rozrywka
                - id: nature
                  name: Przyroda
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
  /routes:
    get:
      tags:
      - Routes
      operationId: listRoutes
      summary: List published curated routes
      description: 'Compact unpaginated summaries. Home can show the first few entries. Stable title-then-ID
        order; not a popularity ranking. Empty matches return data: []. Only cityId is supported; unknown
        query parameters return 400. No category filter is needed for the revised MVP.'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutesResponse'
              examples:
                routes:
                  value:
                    data:
                    - id: route_stare_miasto
                      city:
                        id: city_poznan
                        name: Poznań
                      title: Serce Starego Miasta
                      shortDescription: Krótki spacer od Rynku do Fary.
                      imageUrl: null
                      categoryIds:
                      - sightseeing
                      statistics:
                        distanceMeters: 250
                        walkingDurationMinutes: 4
                        visitDurationMinutes: 60
                        totalDurationMinutes: 64
                        estimatedCostPln: 0
                        stopCount: 2
                noMatches:
                  value:
                    data: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: cityId
        in: query
        required: false
        description: 'Exact city ID. Any syntactically valid ID with no matches, including an unknown
          city, returns 200 with data: []. Omitted returns all published routes.'
        schema:
          $ref: '#/components/schemas/ResourceId'
  /routes/{routeId}:
    get:
      tags:
      - Routes
      operationId: getRoute
      summary: Get a published route
      description: One response supplies all route details, ordered embedded Places, statistics and routed
        geometry. Drafts are not public.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuratedRouteResponse'
              example:
                data:
                  id: route_stare_miasto
                  city:
                    id: city_poznan
                    name: Poznań
                  title: Serce Starego Miasta
                  shortDescription: Krótki spacer od Rynku do Fary.
                  imageUrl: null
                  categoryIds:
                  - sightseeing
                  statistics:
                    distanceMeters: 250
                    walkingDurationMinutes: 4
                    visitDurationMinutes: 60
                    totalDurationMinutes: 64
                    estimatedCostPln: 0
                    stopCount: 2
                  description: Spacer po historycznym centrum z czasem na zwiedzanie.
                  stops:
                  - position: 1
                    place:
                      id: place_stary_rynek
                      cityId: city_poznan
                      name: Stary Rynek
                      description: Historyczny rynek z renesansowym ratuszem.
                      address: Stary Rynek, Poznań
                      latitude: 52.4083
                      longitude: 16.9342
                      categoryIds:
                      - sightseeing
                      visitDurationMinutes: 30
                      estimatedCostPln: 0
                      imageUrl: null
                  - position: 2
                    place:
                      id: place_fara
                      cityId: city_poznan
                      name: Fara Poznańska
                      description: Barokowa bazylika przy ulicy Gołębiej.
                      address: ul. Gołębia 1, Poznań
                      latitude: 52.4065
                      longitude: 16.9345
                      categoryIds:
                      - sightseeing
                      visitDurationMinutes: 30
                      estimatedCostPln: 0
                      imageUrl: null
                  geometry:
                    type: LineString
                    coordinates:
                    - - 16.9342
                      - 52.4083
                    - - 16.9348
                      - 52.4083
                    - - 16.9348
                      - 52.4075
                    - - 16.9348
                      - 52.4068
                    - - 16.9345
                      - 52.4065
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: routeId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ResourceId'
  /places/{placeId}:
    get:
      tags:
      - Places
      operationId: getPlace
      summary: Get an available Place
      description: Independent Place details; not scoped to a route. Unavailable Places are not public.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceResponse'
              example:
                data:
                  id: place_stary_rynek
                  cityId: city_poznan
                  name: Stary Rynek
                  description: Historyczny rynek z renesansowym ratuszem.
                  address: Stary Rynek, Poznań
                  latitude: 52.4083
                  longitude: 16.9342
                  categoryIds:
                  - sightseeing
                  visitDurationMinutes: 30
                  estimatedCostPln: 0
                  imageUrl: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: placeId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ResourceId'
  /route-generator:
    post:
      tags:
      - Generation
      operationId: generateRoute
      summary: Generate a complete personalized walk
      description: Anonymous synchronous generation. At least two distinct available same-city Places,
        each matching at least one selected category (OR); selected categories need not all be represented.
        Prefer broader requested coverage among equally feasible choices, without prescribing ranking.
        Respect hard budget/time/intensity limits and optional excludePlaceIds. Unknown/external-city
        exclusion IDs are ignored; no excluded ID may appear. 422 CITY_NOT_SUPPORTED for unsupported city;
        422 NO_FEASIBLE_ROUTE when no valid result remains. 502/503 is provider failure, not infeasibility.
        Repeating identical inputs can return the same walk. No persistence, polling, job ID or frontend
        distance calculation.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedRouteResponse'
              examples:
                route:
                  value:
                    data:
                      city:
                        id: city_poznan
                        name: Poznań
                      title: Serce Starego Miasta
                      categoryIds:
                      - sightseeing
                      statistics:
                        distanceMeters: 250
                        walkingDurationMinutes: 4
                        visitDurationMinutes: 60
                        totalDurationMinutes: 64
                        estimatedCostPln: 0
                        stopCount: 2
                      stops:
                      - position: 1
                        place:
                          id: place_stary_rynek
                          cityId: city_poznan
                          name: Stary Rynek
                          description: Historyczny rynek z renesansowym ratuszem.
                          address: Stary Rynek, Poznań
                          latitude: 52.4083
                          longitude: 16.9342
                          categoryIds:
                          - sightseeing
                          visitDurationMinutes: 30
                          estimatedCostPln: 0
                          imageUrl: null
                      - position: 2
                        place:
                          id: place_fara
                          cityId: city_poznan
                          name: Fara Poznańska
                          description: Barokowa bazylika przy ulicy Gołębiej.
                          address: ul. Gołębia 1, Poznań
                          latitude: 52.4065
                          longitude: 16.9345
                          categoryIds:
                          - sightseeing
                          visitDurationMinutes: 30
                          estimatedCostPln: 0
                          imageUrl: null
                      geometry:
                        type: LineString
                        coordinates:
                        - - 16.9342
                          - 52.4083
                        - - 16.9348
                          - 52.4083
                        - - 16.9348
                          - 52.4075
                        - - 16.9348
                          - 52.4068
                        - - 16.9345
                          - 52.4065
                subsetOfRequestedInterests:
                  summary: Valid for sightseeing + food when only sightseeing is feasible
                  value:
                    data:
                      city:
                        id: city_poznan
                        name: Poznań
                      title: Serce Starego Miasta
                      categoryIds:
                      - sightseeing
                      statistics:
                        distanceMeters: 250
                        walkingDurationMinutes: 4
                        visitDurationMinutes: 60
                        totalDurationMinutes: 64
                        estimatedCostPln: 0
                        stopCount: 2
                      stops:
                      - position: 1
                        place:
                          id: place_stary_rynek
                          cityId: city_poznan
                          name: Stary Rynek
                          description: Historyczny rynek z renesansowym ratuszem.
                          address: Stary Rynek, Poznań
                          latitude: 52.4083
                          longitude: 16.9342
                          categoryIds:
                          - sightseeing
                          visitDurationMinutes: 30
                          estimatedCostPln: 0
                          imageUrl: null
                      - position: 2
                        place:
                          id: place_fara
                          cityId: city_poznan
                          name: Fara Poznańska
                          description: Barokowa bazylika przy ulicy Gołębiej.
                          address: ul. Gołębia 1, Poznań
                          latitude: 52.4065
                          longitude: 16.9345
                          categoryIds:
                          - sightseeing
                          visitDurationMinutes: 30
                          estimatedCostPln: 0
                          imageUrl: null
                      geometry:
                        type: LineString
                        coordinates:
                        - - 16.9342
                          - 52.4083
                        - - 16.9348
                          - 52.4083
                        - - 16.9348
                          - 52.4075
                        - - 16.9348
                          - 52.4068
                        - - 16.9345
                          - 52.4065
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: 'Unsupported city or no feasible route respecting preferences, hard limits and
            exclusions. Codes: CITY_NOT_SUPPORTED, NO_FEASIBLE_ROUTE.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CITY_NOT_SUPPORTED:
                  summary: CITY_NOT_SUPPORTED
                  value:
                    error:
                      code: CITY_NOT_SUPPORTED
                      message: Selected city is not supported
                NO_FEASIBLE_ROUTE:
                  summary: NO_FEASIBLE_ROUTE
                  value:
                    error:
                      code: NO_FEASIBLE_ROUTE
                      message: No route satisfies the requested limits and exclusions
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/ProviderFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRouteRequest'
            examples:
              basic:
                value:
                  cityId: city_poznan
                  categoryIds:
                  - sightseeing
                  budgetPln: 150
                  maxMinutes: 180
                  walkingIntensity: medium
              anotherVariant:
                summary: Try another variant; excluded Place IDs are hard constraints
                value:
                  cityId: city_poznan
                  categoryIds:
                  - sightseeing
                  - food
                  budgetPln: 150
                  maxMinutes: 180
                  walkingIntensity: medium
                  excludePlaceIds:
                  - place_previous_cafe
  /auth/login:
    post:
      tags:
      - Authentication
      operationId: login
      summary: Log in as user or administrator
      description: Shared credentials exchange for user/admin. Verified enabled accounts receive access
        (900 seconds) and refresh (604800 seconds from login) credentials. Invalid email/password combinations,
        unknown and disabled accounts share 401 UNAUTHORIZED. A correct password on an unverified account
        returns 403 EMAIL_NOT_VERIFIED and no session. Each successful login creates its own refresh session.
        Maximum 10 attempts/15 minutes per normalized email and 30/15 minutes per source IP, enforced
        independently of account existence; 429 includes Retry-After. No cookie, MFA, device or role-selection
        flow.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenSessionResponse'
              example:
                data:
                  accessToken: example-access-token-not-a-real-credential
                  refreshToken: example-refresh-token-not-a-real-credential
                  tokenType: Bearer
                  expiresIn: 900
                  refreshExpiresAt: '2026-11-16T12:00:00Z'
          headers:
            Cache-Control:
              description: Never cache authentication/user responses, including errors and empty success
                responses.
              schema:
                type: string
                const: no-store
              example: no-store
        '400':
          description: Invalid JSON, unknown fields/query parameters, incorrect types or schema validation
            failure. Numeric strings are not accepted in JSON bodies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Invalid request
          headers:
            Cache-Control:
              description: Never cache authentication/user responses, including errors and empty success
                responses.
              schema:
                type: string
                const: no-store
              example: no-store
        '401':
          description: Missing, invalid or expired access credential, invalid login, or expired/revoked/invalid
            refresh session. Refresh tokens never authenticate bearer-protected operations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Authentication failed or session is invalid
          headers:
            WWW-Authenticate:
              description: Bearer challenge.
              schema:
                type: string
              example: Bearer realm="trasa"
            Cache-Control:
              description: Never cache authentication/user responses, including errors and empty success
                responses.
              schema:
                type: string
                const: no-store
              example: no-store
        '403':
          description: 'Correct password, but email verification is required. Codes: EMAIL_NOT_VERIFIED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_NOT_VERIFIED:
                  summary: EMAIL_NOT_VERIFIED
                  value:
                    error:
                      code: EMAIL_NOT_VERIFIED
                      message: Verify your email before logging in
          headers:
            Cache-Control:
              description: Never cache authentication/user responses, including errors and empty success
                responses.
              schema:
                type: string
                const: no-store
              example: no-store
        '429':
          description: Request limit exceeded. Retry-After gives whole seconds until retry. Email-based
            limits apply independently of whether the account exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: RATE_LIMITED
                  message: Too many requests
          headers:
            Retry-After:
              description: Seconds until a retry is allowed.
              schema:
                type: integer
                minimum: 1
              example: 30
            Cache-Control:
              description: Never cache authentication/user responses, including errors and empty success
                responses.
              schema:
                type: string
                const: no-store
              example: no-store
        '500':
          description: Unexpected server failure. No implementation details are exposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Internal server error
          headers:
            Cache-Control:
              description: Never cache authentication/user responses, including errors and empty success
                responses.
              schema:
                type: string
                const: no-store
              example: no-store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: a-long-example-password
  /admin/places:
    get:
      tags:
      - Admin Places
      operationId: listAdminPlaces
      summary: List all Places
      description: Unpaginated available and unavailable Places from all supported cities, stable name-then-ID
        order. Includes fields needed to select stops and edit availability; filter small lists locally.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlacesResponse'
              example:
                data:
                - id: place_stary_rynek
                  cityId: city_poznan
                  name: Stary Rynek
                  description: Historyczny rynek z renesansowym ratuszem.
                  address: Stary Rynek, Poznań
                  latitude: 52.4083
                  longitude: 16.9342
                  categoryIds:
                  - sightseeing
                  visitDurationMinutes: 30
                  estimatedCostPln: 0
                  imageUrl: null
                  isAvailable: true
                  providerIdentity: null
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - BearerAuth: []
    post:
      tags:
      - Admin Places
      operationId: createPlace
      summary: Create an independent Place
      description: Creates a reusable Place with requested availability. Availability requires nonempty
        description/address and at least one category. Eligibility is independent of curated-route membership.
        Unknown city reference returns 422 CITY_NOT_SUPPORTED with cityId issue.
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlaceResponse'
              example:
                data:
                  id: place_stary_rynek
                  cityId: city_poznan
                  name: Stary Rynek
                  description: Historyczny rynek z renesansowym ratuszem.
                  address: Stary Rynek, Poznań
                  latitude: 52.4083
                  longitude: 16.9342
                  categoryIds:
                  - sightseeing
                  visitDurationMinutes: 30
                  estimatedCostPln: 0
                  imageUrl: null
                  isAvailable: true
                  providerIdentity: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: 'Unknown city body reference. Codes: CITY_NOT_SUPPORTED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CITY_NOT_SUPPORTED:
                  summary: CITY_NOT_SUPPORTED
                  value:
                    error:
                      code: CITY_NOT_SUPPORTED
                      message: Selected city is not supported
                      issues:
                      - path: cityId
                        message: City is not supported
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceWrite'
            example:
              cityId: city_poznan
              name: Stary Rynek
              description: Historyczny rynek z renesansowym ratuszem.
              address: Stary Rynek, Poznań
              latitude: 52.4083
              longitude: 16.9342
              categoryIds:
              - sightseeing
              visitDurationMinutes: 30
              estimatedCostPln: 0
              imageUrl: null
              isAvailable: true
  /admin/places/{placeId}:
    get:
      tags:
      - Admin Places
      operationId: getAdminPlace
      summary: Get a Place for editing
      description: Includes availability and provider identity.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlaceResponse'
              example:
                data:
                  id: place_stary_rynek
                  cityId: city_poznan
                  name: Stary Rynek
                  description: Historyczny rynek z renesansowym ratuszem.
                  address: Stary Rynek, Poznań
                  latitude: 52.4083
                  longitude: 16.9342
                  categoryIds:
                  - sightseeing
                  visitDurationMinutes: 30
                  estimatedCostPln: 0
                  imageUrl: null
                  isAvailable: true
                  providerIdentity: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - BearerAuth: []
      parameters:
      - name: placeId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ResourceId'
    put:
      tags:
      - Admin Places
      operationId: replacePlace
      summary: Replace editable Place fields
      description: Full editable-field replacement; omitted imageUrl clears it, identity/providerIdentity
        remain unchanged. cityId is immutable (409 PLACE_CITY_CONFLICT). Safe changes to name, description,
        address, imageUrl and categoryIds are allowed even when published routes reference this Place;
        update embedded Place data and derived route category unions consistently before acknowledging
        success. Compare normalized values, not merely presence of keys. If latitude, longitude, isAvailable,
        estimatedCostPln or visitDurationMinutes actually changes and ANY dependent route is published,
        reject the whole write with 409 PLACE_IN_PUBLISHED_ROUTE; unpublish those routes first. Such changes
        on draft-only dependencies invalidate geometry/statistics together. Safe-only edits leave geometry/statistics
        unchanged. Never return a partial write or stale public categories/Place data.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlaceResponse'
              example:
                data:
                  id: place_stary_rynek
                  cityId: city_poznan
                  name: Stary Rynek
                  description: Historyczny rynek z renesansowym ratuszem.
                  address: Stary Rynek, Poznań
                  latitude: 52.4083
                  longitude: 16.9342
                  categoryIds:
                  - sightseeing
                  visitDurationMinutes: 30
                  estimatedCostPln: 0
                  imageUrl: null
                  isAvailable: true
                  providerIdentity: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Operation conflicts with current resource state; no write is applied. Codes: PLACE_CITY_CONFLICT,
            PLACE_IN_PUBLISHED_ROUTE.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PLACE_CITY_CONFLICT:
                  summary: PLACE_CITY_CONFLICT
                  value:
                    error:
                      code: PLACE_CITY_CONFLICT
                      message: A Place cannot be moved to another city
                PLACE_IN_PUBLISHED_ROUTE:
                  summary: PLACE_IN_PUBLISHED_ROUTE
                  value:
                    error:
                      code: PLACE_IN_PUBLISHED_ROUTE
                      message: Unpublish dependent routes before changing coordinates, availability, cost
                        or visit duration
