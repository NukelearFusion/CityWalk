      operationId: refreshSession
      summary: Refresh access without rotating refresh token
      description: 'Anonymous bearer-wise: the JSON refreshToken is the session credential. Check token
        validity, original expiry, revocation and verified enabled account. Return 401 UNAUTHORIZED for
        invalid/expired/revoked sessions, without creating a new session. Success issues a new 900-second
        access token and returns the exact same refreshToken and original refreshExpiresAt. No rotation,
        replacement refresh token, sliding expiry or expiry extension. Old access tokens may remain valid
        until their own expiry. Maximum 60 requests/minute per source IP; 429 with Retry-After.'
      responses:
