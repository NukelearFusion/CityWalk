          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Authentication failed or session is invalid
          headers:
            WWW-Authenticate:
              description: Bearer challenge.
              schema:
                type: string
              example: Bearer realm="trasa"
            Cache-Control:
              description: Never cache authentication/user responses, including errors and empty success
                responses.
              schema:
                type: string
                const: no-store
              example: no-store
        '500':
          description: Unexpected server failure. No implementation details are exposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL_ERROR
                  message: Internal server error
          headers:
            Cache-Control:
              description: Never cache authentication/user responses, including errors and empty success
                responses.
              schema:
                type: string
                const: no-store
              example: no-store
      security:
      - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Access token from login/refresh, sent as Authorization: Bearer <accessToken>. Valid
        for 900 seconds. Both user/admin use this format. Refresh tokens are accepted only in JSON bodies
        of /auth/refresh and /auth/logout, never as access credentials. Public browsing/generation ignores
        credentials; /admin/* additionally requires role admin.'
  schemas:
    ResourceId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9_-]+$
      description: Opaque, case-sensitive stable string ID. Never parse it or derive it from a name/position.
        Examples are illustrative, not reserved IDs.
      examples:
      - city_poznan
    CategoryId:
      type: string
      enum:
      - sightseeing
      - food
      - entertainment
      - nature
      description: Stable category IDs shared by Places and generation. Multiple selections mean mixed
        interests; there is no mixed category.
    MoneyPln:
      type: integer
      minimum: 0
      maximum: 100000
      description: Estimated PLN per person, in whole złoty. Zero means free. Estimates are planning inputs,
        not guaranteed admission prices.
    ImageUrl:
      type:
      - string
      - 'null'
      format: uri
      maxLength: 2048
      pattern: ^https://
      description: One optional HTTPS image URL; null means no image. Omit on writes to clear it. No upload
        or gallery API.
    City:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - centerLatitude
      - centerLongitude
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 0
          maxLength: 2000
        centerLatitude:
          type: number
          minimum: -90
          maximum: 90
        centerLongitude:
          type: number
          minimum: -180
          maximum: 180
      examples:
      - id: city_poznan
        name: Poznań
        description: Spacery po historycznym centrum Poznania.
        centerLatitude: 52.4083
        centerLongitude: 16.9342
    Category:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          $ref: '#/components/schemas/CategoryId'
        name:
          type: string
          minLength: 1
          maxLength: 80
      description: Display name is Polish in MVP. API content is not localized by request headers.
      examples:
      - id: sightseeing
        name: Zwiedzanie
    Place:
      type: object
      additionalProperties: false
      required:
      - id
      - cityId
      - name
      - description
      - address
      - latitude
      - longitude
      - categoryIds
      - visitDurationMinutes
      - estimatedCostPln
      - imageUrl
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        cityId:
          $ref: '#/components/schemas/ResourceId'
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 5000
        address:
          type: string
          minLength: 1
          maxLength: 300
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        categoryIds:
          type: array
          items:
            $ref: '#/components/schemas/CategoryId'
          minItems: 1
          maxItems: 4
          uniqueItems: true
        visitDurationMinutes:
          type: integer
          minimum: 0
          maximum: 480
        estimatedCostPln:
          type: integer
          minimum: 0
          description: Estimated whole PLN per person; 0 means free. Review imported default estimates
            before enabling availability.
          maximum: 2000
        imageUrl:
          $ref: '#/components/schemas/ImageUrl'
      description: Public available Place; independent of route membership. Stable ID is also embedded
        in route stops.
      examples:
      - id: place_stary_rynek
        cityId: city_poznan
        name: Stary Rynek
        description: Historyczny rynek z renesansowym ratuszem.
        address: Stary Rynek, Poznań
        latitude: 52.4083
        longitude: 16.9342
        categoryIds:
        - sightseeing
        visitDurationMinutes: 30
        estimatedCostPln: 0
        imageUrl: null
    ProviderIdentity:
      type: object
      additionalProperties: false
      required:
      - provider
      - providerPlaceId
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 80
        providerPlaceId:
          type: string
          minLength: 1
          maxLength: 256
      description: Opaque provider namespace and identity from search. No provider-specific API payload
        is exposed.
      examples:
      - provider: poi_catalog
        providerPlaceId: poznan-123
    AdminPlace:
      type: object
      additionalProperties: false
      required:
      - id
      - cityId
      - name
      - description
      - address
      - latitude
      - longitude
      - categoryIds
      - visitDurationMinutes
      - estimatedCostPln
      - imageUrl
      - isAvailable
      - providerIdentity
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        cityId:
          $ref: '#/components/schemas/ResourceId'
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 0
          maxLength: 5000
        address:
          type: string
          minLength: 0
          maxLength: 300
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        categoryIds:
          type: array
          items:
            $ref: '#/components/schemas/CategoryId'
          minItems: 0
          maxItems: 4
          uniqueItems: true
        visitDurationMinutes:
          type: integer
          minimum: 0
          maximum: 480
        estimatedCostPln:
          type: integer
          minimum: 0
          description: Estimated whole PLN per person; 0 means free. Review imported default estimates
            before enabling availability.
          maximum: 2000
        imageUrl:
          $ref: '#/components/schemas/ImageUrl'
        isAvailable:
          type: boolean
          description: True exposes this Place publicly and makes it eligible for generation, independently
            of curated routes. False keeps it admin-only.
        providerIdentity:
          oneOf:
          - $ref: '#/components/schemas/ProviderIdentity'
          - type: 'null'
      description: Unavailable Places may have empty descriptions, addresses and categories so imports
        can be completed in a form. When available, public Place completeness rules apply. Safe metadata/category
        changes propagate to embedded route data; coordinates, availability, cost or visit-duration changes
        follow the published-dependency conflict rule on PUT.
      allOf:
      - if:
          properties:
            isAvailable:
              const: true
          required:
          - isAvailable
        then:
          properties:
            description:
              minLength: 1
            address:
              minLength: 1
            categoryIds:
              minItems: 1
      examples:
      - id: place_stary_rynek
        cityId: city_poznan
        name: Stary Rynek
        description: Historyczny rynek z renesansowym ratuszem.
        address: Stary Rynek, Poznań
        latitude: 52.4083
        longitude: 16.9342
        categoryIds:
        - sightseeing
        visitDurationMinutes: 30
        estimatedCostPln: 0
        imageUrl: null
        isAvailable: true
        providerIdentity: null
    PlaceWrite:
      type: object
      additionalProperties: false
      required:
      - cityId
      - name
      - description
      - address
      - latitude
      - longitude
      - categoryIds
      - visitDurationMinutes
      - estimatedCostPln
      - isAvailable
      properties:
        cityId:
          $ref: '#/components/schemas/ResourceId'
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 0
          maxLength: 5000
        address:
          type: string
          minLength: 0
          maxLength: 300
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        categoryIds:
          type: array
          items:
            $ref: '#/components/schemas/CategoryId'
          minItems: 0
          maxItems: 4
          uniqueItems: true
        visitDurationMinutes:
          type: integer
          minimum: 0
          maximum: 480
        estimatedCostPln:
          type: integer
          minimum: 0
          description: Estimated whole PLN per person; 0 means free. Review imported default estimates
            before enabling availability.
          maximum: 2000
        imageUrl:
          $ref: '#/components/schemas/ImageUrl'
        isAvailable:
          type: boolean
          description: True exposes this Place publicly and makes it eligible for generation, independently
            of curated routes. False keeps it admin-only.
      description: Complete editable Place fields for POST and PUT. Missing imageUrl is normalized to
        null. Trim names/descriptions/addresses before checking lengths; whitespace-only required text
        is invalid. cityId is immutable after creation (409 PLACE_CITY_CONFLICT).
      allOf:
      - if:
          properties:
            isAvailable:
              const: true
          required:
          - isAvailable
        then:
          properties:
            description:
              minLength: 1
            address:
              minLength: 1
            categoryIds:
              minItems: 1
      examples:
      - cityId: city_poznan
        name: Stary Rynek
        description: Historyczny rynek z renesansowym ratuszem.
        address: Stary Rynek, Poznań
        latitude: 52.4083
        longitude: 16.9342
        categoryIds:
        - sightseeing
        visitDurationMinutes: 30
        estimatedCostPln: 0
        imageUrl: null
        isAvailable: true
    RouteStatistics:
      type: object
      additionalProperties: false
      required:
      - distanceMeters
      - walkingDurationMinutes
      - visitDurationMinutes
      - totalDurationMinutes
      - estimatedCostPln
      - stopCount
      properties:
        distanceMeters:
          type: integer
          minimum: 0
          description: Length of the routed pedestrian path, rounded up to whole metres; never great-circle
            distance between stops.
        walkingDurationMinutes:
          type: integer
          minimum: 0
          description: Estimated walking minutes, rounded up to whole minutes.
        visitDurationMinutes:
          type: integer
          minimum: 0
          description: Sum of embedded Places' visitDurationMinutes.
        totalDurationMinutes:
          type: integer
          minimum: 0
          description: Exactly walkingDurationMinutes + visitDurationMinutes.
        estimatedCostPln:
          $ref: '#/components/schemas/MoneyPln'
        stopCount:
          type: integer
          minimum: 0
          maximum: 50
      description: Same meanings for curated and generated routes. Cost is the sum of Place costs. Constraints
        use these returned rounded values, not lower unrounded estimates. No travel before the first or
        after the last stop is included.
      examples:
      - distanceMeters: 250
        walkingDurationMinutes: 4
        visitDurationMinutes: 60
        totalDurationMinutes: 64
        estimatedCostPln: 0
        stopCount: 2
    WalkingGeometry:
      type: object
      additionalProperties: false
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          const: LineString
        coordinates:
          type: array
          items:
            type: array
            prefixItems:
            - type: number
              minimum: -180
              maximum: 180
            - type: number
              minimum: -90
              maximum: 90
            items: false
            minItems: 2
            maxItems: 2
          minItems: 2
      description: GeoJSON LineString in WGS84 decimal degrees, [longitude, latitude]. A routed walkable
        path visiting stops in order, from the first to last Place (access points may be snapped to the
        pedestrian network). Connecting POI coordinates directly is not a substitute. Frontend renders
        this geometry and must not invent it or recalculate walking statistics.
      examples:
      - type: LineString
        coordinates:
        - - 16.9342
          - 52.4083
        - - 16.9348
          - 52.4083
        - - 16.9348
          - 52.4075
        - - 16.9348
          - 52.4068
        - - 16.9345
          - 52.4065
    RouteStop:
      type: object
      additionalProperties: false
      required:
      - position
      - place
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 50
        place:
          $ref: '#/components/schemas/Place'
      description: Place membership, not a new Place identity. Array order and contiguous 1-based position
        agree. Each Place ID occurs once. Embedded Place fields are sufficient for itinerary/map/detail
        presentation; no per-stop GET is required.
      examples:
      - position: 1
        place:
          id: place_stary_rynek
          cityId: city_poznan
          name: Stary Rynek
          description: Historyczny rynek z renesansowym ratuszem.
          address: Stary Rynek, Poznań
          latitude: 52.4083
          longitude: 16.9342
          categoryIds:
          - sightseeing
          visitDurationMinutes: 30
          estimatedCostPln: 0
          imageUrl: null
    AdminRouteStop:
      type: object
      additionalProperties: false
      required:
      - position
      - place
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 50
        place:
          $ref: '#/components/schemas/AdminPlace'
      description: Same ordering rules as RouteStop; includes unavailable Places so an administrator can
        correct drafts.
      examples:
      - position: 1
        place:
          id: place_stary_rynek
          cityId: city_poznan
          name: Stary Rynek
          description: Historyczny rynek z renesansowym ratuszem.
          address: Stary Rynek, Poznań
          latitude: 52.4083
          longitude: 16.9342
          categoryIds:
          - sightseeing
          visitDurationMinutes: 30
          estimatedCostPln: 0
          imageUrl: null
          isAvailable: true
          providerIdentity: null
    CuratedRouteSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - city
      - title
      - shortDescription
      - imageUrl
      - categoryIds
      - statistics
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        city:
          $ref: '#/components/schemas/CityReference'
        title:
          type: string
          minLength: 1
          maxLength: 160
        shortDescription:
          type: string
          minLength: 1
          maxLength: 280
        imageUrl:
          $ref: '#/components/schemas/ImageUrl'
        categoryIds:
          type: array
          items:
            $ref: '#/components/schemas/CategoryId'
          minItems: 1
          maxItems: 4
          uniqueItems: true
        statistics:
          $ref: '#/components/schemas/RouteStatistics'
      description: Published curated route. categoryIds is the deduplicated union of stop Place categories,
        ordered as /categories; not separately editable. Lists omit description, stops and geometry.
      examples:
      - id: route_stare_miasto
        city:
          id: city_poznan
          name: Poznań
        title: Serce Starego Miasta
        shortDescription: Krótki spacer od Rynku do Fary.
        imageUrl: null
        categoryIds:
        - sightseeing
        statistics:
          distanceMeters: 250
          walkingDurationMinutes: 4
          visitDurationMinutes: 60
          totalDurationMinutes: 64
          estimatedCostPln: 0
          stopCount: 2
    CuratedRoute:
      type: object
      additionalProperties: false
      required:
      - id
      - city
      - title
      - shortDescription
      - imageUrl
      - categoryIds
      - statistics
      - description
      - stops
      - geometry
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        city:
          $ref: '#/components/schemas/CityReference'
        title:
          type: string
          minLength: 1
          maxLength: 160
        shortDescription:
          type: string
          minLength: 1
          maxLength: 280
        imageUrl:
          $ref: '#/components/schemas/ImageUrl'
        categoryIds:
          type: array
          items:
            $ref: '#/components/schemas/CategoryId'
          minItems: 1
          maxItems: 4
          uniqueItems: true
        statistics:
