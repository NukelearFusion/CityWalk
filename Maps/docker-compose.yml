# Local development services.
#
# Only the database runs here: the API and the web client are started with
# `npm run dev`, so a code change reloads instantly instead of rebuilding an image.
#
#   docker compose up -d postgres
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: citywalk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: citywalk
      POSTGRES_PASSWORD: citywalk_dev
      POSTGRES_DB: citywalk
      # Matches the collation Render provisions, so ordering behaves identically
      # in development and in production.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=pl-PL'
    ports:
      # Exposed on a non-default port to avoid colliding with a PostgreSQL
      # already installed on the host.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The API's migrations run as soon as this reports healthy.
      test: ['CMD-SHELL', 'pg_isready -U citywalk -d citywalk']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
