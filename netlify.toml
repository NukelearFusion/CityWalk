# Netlify: web build of the Expo app in client/.
# Set EXPO_PUBLIC_API_URL in Site settings → Environment variables,
# e.g. https://citywalk-api.onrender.com/api/v1 — it is baked in at build time.

[build]
  base = "client"
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every path is served by index.html and routed in the browser.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
