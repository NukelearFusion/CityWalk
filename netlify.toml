# Netlify: web build of the Expo app in client/.
# EXPO_PUBLIC_API_URL is baked into the bundle at build time. It is public by
# nature, so it lives here; a value set in the Netlify UI takes precedence.

[build]
  base = "client"
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  EXPO_PUBLIC_API_URL = "https://citywalk-api-qke1.onrender.com/api/v1"

# Single-page app: every path is served by index.html and routed in the browser.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
